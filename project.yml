name: JazzyChords
options:
  bundleIdPrefix: com.frankmathy
  deploymentTarget:
    macOS: "15.4"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: Y2NF3B2C3V
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    ARCHS: arm64

packages:
  ChordCore:
    path: ChordCore

targets:
  JazzyChords:
    type: application
    platform: macOS
    sources: [JazzyChords]
    dependencies:
      - target: JazzyChordsAU
    info:
      path: JazzyChords/Info.plist
      properties:
        CFBundleDisplayName: JazzyChords
        LSApplicationCategoryType: public.app-category.music
    entitlements:
      path: JazzyChords/JazzyChords.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frankmathy.JazzyChords
    scheme:
      testTargets: []

  JazzyChordsAU:
    type: app-extension
    platform: macOS
    sources: [JazzyChordsAU]
    dependencies:
      - package: ChordCore
      - sdk: CoreAudioKit.framework
    info:
      path: JazzyChordsAU/Info.plist
      properties:
        CFBundleDisplayName: JazzyChords
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).AudioUnitViewController
          NSExtensionAttributes:
            AudioComponents:
              - name: "Frank Mathy: JazzyChords"
                description: "Soulful house, jazz and R&B chord trigger"
                manufacturer: Fmth
                type: aumi
                subtype: Jzch
                version: 65536
                sandboxSafe: true
                tags: [Effects]
    entitlements:
      path: JazzyChordsAU/JazzyChordsAU.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.frankmathy.JazzyChords.AU
        SKIP_INSTALL: YES
